<!--
  미디어 조각 — skiper91(폰 화면) · skiper97(영상) 자리에 쓰는 것.
  Pro 패키지는 이 정적 사이트에 설치되지 않음. 역할만 이 톤으로 준비해 둠.
  지금은 01–03에 안 붙어 있음. 필요할 때 아래를 복사해 케이스에 붙인다.

  뭘 붙이나
    폰 UI 캡처 / 폰 녹화  →  PHONE
    와이드 영상, 프로세스  →  VIDEO
    그냥 큰 사진          →  기존 .cv-fig (이거 쓰지 않음)

  어디에
    히어로(제목 아래 큰 자리)  VIDEO 또는 기존 cv-fig
    최종 디자인 01·02·03 칸   PHONE  (cv-figsm 대신)
    본문 한가운데 폰 한 대     PHONE 그대로
-->

<!-- PHONE — 이미지 -->
<figure class="jr-phone">
  <div class="jr-phone__bezel">
    <div class="jr-phone__island" aria-hidden="true"></div>
    <div class="jr-phone__screen">
      <img src="assets/images/__slug__-screen.png" alt="">
    </div>
  </div>
</figure>

<!-- STACKED PHOTOS — 03 슬롯. 폰 자리. 텍스트 없음. <> 는 이미지 하단 중앙. 자동 전환 없음. -->
<div class="cv-at">
  <div class="cv-at-stack">
    <div class="cv-at-card"><img src="assets/images/at/sarah.jpg" alt="" width="500" height="500" draggable="false"></div>
  </div>
  <div class="cv-at-nav">
    <button type="button" class="cv-at-prev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M5 12l6 6"/><path d="M5 12l6-6"/></svg></button>
    <button type="button" class="cv-at-next" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 18l6-6"/><path d="M13 6l6 6"/></svg></button>
  </div>
</div>

<!-- PHONE — 최종 디자인 칸. cv-figsm 자리를 이걸로 -->
<div class="cv-feat">
  <figure class="jr-phone">
    <div class="jr-phone__bezel">
      <div class="jr-phone__island" aria-hidden="true"></div>
      <div class="jr-phone__screen">
        <img src="assets/images/__slug__-f1.png" alt="">
      </div>
    </div>
  </figure>
  <p data-i18n="__p__F1"></p>
</div>

<!-- VIDEO — 히어로. cv-fig 대신. 클립 마스크가 기본, 사각이면 data-shape="rect" -->
<figure class="jr-video">
  <video src="assets/video/__slug__.mp4" poster="assets/images/__slug__-poster.jpg" controls playsinline preload="metadata"></video>
</figure>
